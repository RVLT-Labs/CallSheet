name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callsheet
          POSTGRES_PASSWORD: callsheet
          POSTGRES_DB: callsheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://callsheet:callsheet@localhost:5432/callsheet?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: "Callsheet <noreply@rvlt.app>"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
